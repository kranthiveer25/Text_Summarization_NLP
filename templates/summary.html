<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <title>Summary</title>
    <!-- Link to Bootstrap CSS -->
    <link rel="stylesheet" href="https://maxcdn.bootstrapcdn.com/bootstrap/4.0.0/css/bootstrap.min.css" 
          integrity="sha384-Gn5384xqQ1aoWXA+058RXPxPg6fy4IWvTNh0E263XmFcJlSAwiGgFAW/dAiS6JXm" 
          crossorigin="anonymous"/>
    <link rel="stylesheet" href="/static/styles.css"/>
    <style>
        body {
            background-color: #343541;
            color: #ffffff;
            font-family: Arial, sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: flex-start;
            height: 100vh;
            margin: 0;
            padding-top: 50px;
        }
        .container {
            max-width: 90%;
            width: 100%;
            background-color: #40414F;
            padding: 20px;
            border-radius: 10px;
            box-shadow: 0 4px 10px rgba(0, 0, 0, 0.2);
        }
        .heading {
            text-align: center;
            font-size: 2.5rem;
            margin-bottom: 10px;
        }
        .summary-container {
            display: flex;
            justify-content: space-between;
            align-items: flex-start;
            width: 100%;
            padding: 20px;
        }
        .text-box {
            width: 48%;
            background-color: #55576A;
            padding: 20px;
            border-radius: 8px;
            box-shadow: 0 4px 10px rgba(0, 0, 0, 0.2);
        }
        .text-box h3 {
            font-size: 1.8rem;
            font-weight: bold;
            color: #19C37D;
            text-align: center;
            background-color: #333;
            padding: 10px;
            border-radius: 5px;
        }
        .text-box p {
            font-size: 1.2rem;
            line-height: 1.6;
            margin-top: 10px;
        }
        .word-count {
            display: flex;
            justify-content: space-between;
            margin-top: 20px;
        }
        .btn {
            font-size: 1.2rem;
            padding: 10px 20px;
            border-radius: 8px;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1 class="heading">TEXT SUMMARIZATION</h1>
        <p class="text-center">Best Summary For The Text</p>
        <div class="summary-container">
            <div class="text-box">
                <h3>Original Text</h3>
                <p>{{ original_txt }}</p>
            </div>
            <div class="text-box">
                <h3>Summary</h3>
                <p>{{ summary }}</p>
            </div>
        </div>
        <div class="word-count">
            <button class="btn btn-danger">Words: {{ len_orig_txt }}</button>
            <button class="btn btn-success">Words: {{ len_summary }}</button>
        </div>
    </div>
</body>
</html>
